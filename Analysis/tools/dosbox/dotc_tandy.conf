# The booter on a Tandy 1000. DEFENDER.COM does not work here (the screen is garbage in
# DOSBox's Tandy mode), so boot the floppy images instead. Make them once with
#   python3 Graphics/gamedat.py Original/ega/GAME.DAT --disks Original/ega
# The game asks for the second disk later: press Ctrl-F4 to swap.
[sdl]
output=opengl
[dosbox]
machine=tandy
[cpu]
core=normal
cputype=auto
cycles=1500
[render]
scaler=normal2x
aspect=true
[autoexec]
mount c ~/Documents/GitHub/Defender-of-the-Crown/Original/ega
c:
boot disk1.img disk2.img
